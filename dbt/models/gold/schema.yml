version: 2

models:
  - name: fact_air_health
    description: >
      Central fact table integrating air quality, disease, and health indicators
      from OpenAQ, ECDC, WHO, and Eurostat. Aggregated by country and year.
    columns:
      - name: country_code
        description: ISO country code (EU-27)
        tests:
          - not_null
      - name: pollutant
        description: Air pollutant name (e.g. PM2.5)
      - name: year
        description: Calendar year of observation
        tests:
          - not_null
      - name: avg_pollutant_value
        description: Average pollutant concentration for given country and year
      - name: disease_type
        description: Type of disease indicator (cases or deaths)
      - name: total_cases
        description: Total reported cases for given year
      - name: avg_rate_14_day
        description: 14-day incidence rate
      - name: who_indicator
        description: WHO indicator code for health metric
      - name: who_value_avg
        description: Average value of WHO health indicator
      - name: avg_emission_value
        description: Average greenhouse gas emission per country
      - name: cases_per_health_metric
        description: "Derived ratio: total cases divided by WHO metric value"

  - name: dim_country
    description: Dimension table containing country-level metadata.
    columns:
      - name: country_code
        description: ISO country code
        tests:
          - unique
          - not_null
      - name: country_name
        description: Official country name
      - name: continent
        description: Continent name
      - name: population
        description: Population size

  - name: dim_year
    description: Dimension table with year identifiers and decade grouping.
    columns:
      - name: year_id
        description: Unique year identifier
        tests:
          - unique
          - not_null
      - name: year
        description: Calendar year
      - name: decade_label
        description: Decade grouping label (e.g., 2010s)

  - name: dim_who_indicator
    description: Dimension table describing WHO health indicators and environmental causes.
    columns:
      - name: who_indicator_code
        description: Unique WHO indicator code
        tests:
          - unique
          - not_null
      - name: who_indicator_subcode
        description: Subcategory of the WHO indicator, if applicable
      - name: environmental_cause
        description: Environmental cause category
      - name: region
        description: WHO region or geographic scope
