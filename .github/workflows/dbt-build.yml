name: dbt build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dbt.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Debug profiles.yml presence
        run: |
          echo "Repo root:"
          ls -R .
          echo "dbt directory:"
          ls -R dbt
          echo "profiles.yml content:"
          cat dbt/profiles.yml

      - name: Run dbt build
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          source .venv/bin/activate
          dbt debug --profiles-dir $DBT_PROFILES_DIR --project-dir ${{ github.workspace }}/dbt
          dbt build --profiles-dir $DBT_PROFILES_DIR --project-dir ${{ github.workspace }}/dbt

